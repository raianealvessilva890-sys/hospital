<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style2.css">
</head>
<body>

<div class="container">

<img src="logo-hospital.png" width="950" alt="Logótipo">

  <h2>🏥 Sistema Hospitalar</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
<button onclick="alert('O botão está funcionando!'); login()">Entrar</button>
</div>

<script>

function login() {
  alert("Iniciando login...");

  fetch("/login", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      usuario: document.getElementById("usuario").value,
      senha: document.getElementById("senha").value
    })
  })
  .then(res => {
    alert("Servidor respondeu: " + res.status);
    return res.json();
  })
  .then(data => {
    alert(JSON.stringify(data));

    if (data.tipo === "triagem") {
      location.href = "triagem.html";
    } else if (data.tipo === "medico") {
      location.href = "medico.html";
    } else if (data.tipo === "atendimento") {
      location.href = "atendimento.html";
    }
  })
  .catch(erro => {
    alert("Erro no login: " + erro);
  });
}
</script>
</body>
</html>
